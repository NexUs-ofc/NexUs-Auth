apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-auth
  namespace: nexus
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nexus-auth
  template:
    metadata:
      labels:
        app: nexus-auth
    spec:
      containers:
        - name: nexus-auth
          image: 516615386106.dkr.ecr.us-east-1.amazonaws.com/ceris/nexus-auth:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nexus-auth-secret
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-auth
  namespace: nexus
spec:
  type: LoadBalancer
  selector:
    app: nexus-auth
  ports:
    - port: 80
      targetPort: 8080
