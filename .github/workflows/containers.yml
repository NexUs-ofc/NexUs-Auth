name: Containers and Kubernetes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render portable Kubernetes manifests
        run: kubectl kustomize k8s
      - uses: docker/setup-buildx-action@v3
      - name: Build container without publishing or deploying
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/container-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
