spring:
  config:
    import: optional:file:src/main/resources/.env.properties
  application:
    name: NexUs-Auth
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false
  main:
    lazy-initialization: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    registration-ttl: ${REGISTRATION_TTL:15m}
    otp-ttl: ${OTP_TTL:10m}
  google:
    client-ids: ${GOOGLE_WEB_CLIENT_ID:},${GOOGLE_ANDROID_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:NexUs}
    brevo-api-key: ${BREVO_API_KEY}

server:
  port: ${PORT:8080}
  error:
    include-message: never
