spring:
  config:
    import: optional:file:src/main/resources/.env.properties
  application:
    name: NexUs-Auth
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
    registration-ttl: ${REGISTRATION_TTL:15m}
    otp-ttl: ${OTP_TTL:10m}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:NexUs}
    brevo-api-key: ${BREVO_API_KEY}

server:
  port: ${PORT:8080}
  error:
    include-message: never
