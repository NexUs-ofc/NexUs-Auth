spring.application.name=NexUs-Auth
spring.config.import=optional:file:.env.properties
app.api-key=${API_KEY}
spring.flyway.lock-retry-count=10
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=30s
app.admin.key=${ADMIN_API_KEY:${TRACING_ACESS:}}
app.admin.metrics.step-ms=${ADMIN_METRICS_STEP_MS:60000}
app.admin.metrics.retention-minutes=${ADMIN_METRICS_RETENTION_MINUTES:720}
