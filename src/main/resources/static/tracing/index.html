<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <title>NexUs Auth Tracing</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

<header>

    <h1>NexUs Auth</h1>
    <p>Métricas de Observabilidade</p>

</header>

<main class="cards">

    <div class="card">
        <h2>CPU</h2>
        <span id="cpu">-- %</span>
    </div>

    <div class="card">
        <h2>Memória JVM</h2>
        <span id="memory">-- MB</span>
    </div>

    <div class="card">
        <h2>Threads</h2>
        <span id="threads">--</span>
    </div>

    <div class="card">
        <h2>Requests</h2>
        <span id="requests">--</span>
    </div>

    <div class="card">
        <h2>Status</h2>
        <span class="online">Online</span>
    </div>

</main>

<footer>

    Atualização automática a cada 5 segundos

</footer>

<script src="script.js"></script>

</body>
</html>
